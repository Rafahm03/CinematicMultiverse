services:
  pg:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=CinematicMultiverse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
    container_name: postgresql-spring
    restart: on-failure
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-spring
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 1
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  app:
    build: CinematicMultiverse
    container_name: cinematicmultiverse
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy
    restart: on-failure

  frontend:

    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cinematicmultiverse-frontend
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  pgadmin-data:
